<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <script src="flight.js" type="text/javascript"></script>
  <style>
  .app {
    text-align: center;
    margin: 20px;
  }

  button {
    margin: 10px;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 20px;
    border: none;
    background-color: #007bff;
    color: white;
  }

  button:hover {
    background-color: #0056b3;
  }

  table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 80%;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }

  th {
    background-color: #dfdfdf;
    cursor: pointer;
  }

  /* Display the sort order */
  th.sort::after {
    content: " ↓";
  }

  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  /* Highlight the cheapest flight */
  tr.highlight {
    background-color: #ffff00af !important;
  }
  </style>
</head>
<body>
  <div id="App"></div>
</body>
</html>
