<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:;base64,=">
        <script src="tasker.js" type="text/javascript"></script>
        <style>
            * {
            box-sizing: border-box;
            }

            .tasklist {
            display: flex;
            flex-flow: row wrap;
            }

            .task {
            flex: 100px;
            padding: 8px;
            margin: 8px;
            background: silver;

            display: flex;
            flex-direction: row;
            }

            .taskleft {
            flex: 1;
            align-items: center;
            justify-content: space-around;
            min-width: 175px;
            padding: 5px;
            margin: 5px;
            background: gold;
            }

            .tasktitle {
            margin: 4px 0px 10px 0px;
            font-weight: bold;
            }

            .taskright {
            flex: 2;
            padding: 5px;
            margin: 5px;
            background: lightblue;
            }

            .taskright textarea {
            width: 100%;
            height: 100%;
            min-width: 250px;
            }
        </style>
    </head>
    <body>
        <div id="App"></div>
    </body>
</html>
